<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div id="calculator-container">
    <div id="calculator-output"></div>
    <div class="input container">
      <button class="clear input">CLEAR</button>
      <button class="back input">BACK</button>
      <button class="operator input" value="/">/</button>
    </div>
    <div class="input container">
      <button class="number input" value="7" >7</button>
      <button class="number input" value="8" >8</button>
      <button class="number input" value="9" >9</button>
      <button class="operator input" value="*">*</button>
    </div>
    <div class="input container">
      <button class="number input" value="4" >4</button>
      <button class="number input" value="5" >5</button>
      <button class="number input" value="6" >6</button>
      <button class="operator input" value="-">-</button>
    </div>
    <div class="input container">
      <button class="number input" value="1" >1</button>
      <button class="number input" value="2" >2</button>
      <button class="number input" value="3" >3</button>
      <button class="operator input" value="+">+</button>
    </div>
    <div class="input container">
      <button class="number input" value="0" >0</button>
      <button class="dot input">.</button>
      <button class="equal input">=</button>
    </div>
  </div>
</body>
</html>
